site_name: "Erebus Rescue Sim: Beginner Guide"
site_description: Get from a blank laptop to a robot driving in the Erebus rescue simulator.
site_url: https://talkingj.github.io/rcja-rescue-sim-resources/
docs_dir: docs

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - search.suggest
    - toc.integrate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition          # the "note / warning / success" callout boxes
  - pymdownx.details    # collapsible fix-it boxes
  - attr_list           # image sizing / classes
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Before you start: before-you-start.md
  - Install:
      - Windows: install-windows.md
      - macOS: install-mac.md
      - Linux (Ubuntu): install-linux.md
  - Your first run: first-run.md
  - Make it move: make-it-move.md
  - "What's next: sensors": next-steps.md
  - "Code: build a scoring robot":
      - Reading a distance sensor: code-sensors.md
      - Driving straight and turning: code-driving.md
      - Reading the floor colour sensor: code-colour.md
      - A wall-follower that survives world1: code-wall-follower.md
      - Turning on the camera: code-camera.md
      - Spotting a victim sign: code-victim-detection.md
      - Reporting a victim and earning your first points: code-reporting.md
      - Reading the clock and the score: code-game-info.md
      - Getting stuck, and recovering from it: code-lack-of-progress.md
      - Sending the exit message: code-exit.md
      - Building and submitting the map matrix: code-mapping.md
      - "Putting it together: a complete scored run": code-complete-run.md
  - "Strategy and competition readiness":
      - Spending your eight minutes: strategy-run-budget.md
      - Scoring maths for strategy decisions: strategy-scoring-maths.md
      - The eight practice worlds and what each is for: practice-worlds.md
      - The debugging playbook: debugging-playbook.md
      - Pre-run and competition-day checklist: competition-day.md
      - The rule violations that quietly cost the most: costly-mistakes.md
  - "Teacher and club material":
      - An 8-week club curriculum: club-curriculum.md
      - "Workshop 2: sensors lab": workshop-sensors.md
  - Rules & Scoring:
      - Quick briefing: briefing.md
      - Classroom workshop (45-60 min): workshop.md
      - Understanding the field: rules-field.md
      - Victims and hazmats: rules-tokens.md
      - How points are earned: rules-scoring.md
      - Drawing the map: rules-map-format.md
      - Rules self-check: rules-quiz.md
      - Official rules (reference): official-rules-2026.md
  - When it goes wrong: troubleshooting.md
  - Glossary: glossary.md
  - Printable pages:
      - Quick-start: quick-start.md
      - Scoring cheat sheet: scoring-cheat-sheet.md
      - Cognitive target decoder: cognitive-target-decoder.md
      - Workshop activity sheet: workshop-activity-sheet.md

# strict is enforced on the command line: mkdocs build --strict
